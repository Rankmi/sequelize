name: "Close stale PRs"
on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          stale-pr-message: "Este PR está inactivo desde hace 7 días. Si no hay actividad en los próximos 3 días, será cerrado automáticamente."
          close-pr-message: "Cerado por inactividad"
          days-before-pr-stale: 7
          days-before-pr-close: 3
          days-before-issue-stale: -1
          days-before-issue-close: -1
